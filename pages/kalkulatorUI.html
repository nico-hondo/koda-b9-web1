<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minitask 03 - Google's Kalkulator UI</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body id="calculate">
    <h1>Google's Kalkulator</h1>
    <div class="textArea">
        <i class="fa fa-refresh"></i>
        <p>0</p>
    </div>
    <main class="kontenCalc">
        <section class="leftSide">
            <div class="btn">
                <p>Deg</p>
                <span>|</span>
                <p>Rad</p>
            </div>
            <div class="btn">x!</div>
            <div class="btn">Inv</div>
            <div class="btn">sin</div>
            <div class="btn">ln</div>
            <div class="btn">phi</div>
            <div class="btn">cos</div>
            <div class="btn">log</div>
            <div class="btn">e</div>
            <div class="btn">tan</div>
            <div class="btn">l</div>
            <div class="btn">Ans</div>
            <div class="btn">Exp</div>
            <div class="btn">xY</div>
        </section>
        <section class="rightSide">
            <div class="btn">(</div>
            <div class="btn">)</div>
            <div class="btn">%</div>
            <div class="btn">AC</div>
            <div class="numBtn">7</div>
            <div class="numBtn">8</div>
            <div class="numBtn">9</div>
            <div class="btn">/</div>
            <div class="numBtn">4</div>
            <div class="numBtn">5</div>
            <div class="numBtn">6</div>
            <div class="btn">x</div>
            <div class="numBtn">1</div>
            <div class="numBtn">2</div>
            <div class="numBtn">3</div>
            <div class="btn">-</div>
            <div class="numBtn">0</div>
            <div class="numBtn">.</div>
            <div class="equalBtn">=</div>
            <div class="btn">+</div>
        </section>
    </main>
</body>
</html>
